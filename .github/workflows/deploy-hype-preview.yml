# Builds the HYPE Athletics site and deploys it to Cloudflare Pages
# (project: hype-athletics-preview → https://hypeathletics.xrev.co).
# Preview builds are marked noindex so they never compete with hypeathletics.org in search.
#
# Requires one repository secret: CLOUDFLARE_API_TOKEN (Account › Cloudflare Pages › Edit).
name: Deploy HYPE preview

on:
  push:
    branches: [main, claude/gracious-maxwell-ppwn96]
    paths: ['hype-athletics/**', '.github/workflows/deploy-hype-preview.yml']
  workflow_dispatch:

concurrency:
  group: hype-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hype-athletics
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ae8bcee803a82250768b47ea25778eed
    steps:
      - name: Check for Cloudflare token
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to enable deploys."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hype-athletics/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          PUBLIC_PREVIEW: '1'
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4.164.0 pages deploy dist --project-name hype-athletics-preview --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_REF_NAME}" --commit-dirty=true
